    <script>
      // Gracefully ignore Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport') || event.message.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || String(event.reason).includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
